on:
  push:
    branches:
      - main
      - performance-runs

parameters:
  container: daisytuner/x64-tenstorrent:0.63.0-latest
  timeout: 360
  partitions:
    - chamomile

steps:
  build: |
    apt-get update
    apt-get install -y build-essential libopenmpi-dev zlib1g-dev gnuplot gnuplot-x11 libxt-dev cmake flex
    apt-get install -y libxml2-dev libhdf5-dev libavfilter-dev libtheora-dev libgl2ps-dev libx11-dev libqt5x11extras5-dev libglew-dev libutfcpp-dev 

    # Set up OpenFOAM environment
    cd 3rdParty/OpenFOAM-dev/
    export WM_PROJECT_DIR=$(pwd)
    . ./etc/custom_bashrc

    # Generate include files
    ./wmake/wmakeLnIncludeAll

    # Install OpenFOAM
    ./Allwmake -j128

    # Build driven cavity example
    cd ${WM_PROJECT_DIR}/tutorials/incompressibleFluid/cavity
    ${FOAM_APPBIN}/blockMesh
    cd ${WM_PROJECT_DIR}

    cp -r $WM_PROJECT_DIR/tutorials/incompressibleFluid/cavity $WM_PROJECT_DIR/tutorials/incompressibleFluid/cavity-TT

    # Build tests with CMake and Ninja

    # Set up DAISY environment for rtl
    export CPATH=$DOCC_ROOT/include:$CPATH
    export LIBRARY_PATH=$DOCC_ROOT/lib:$LIBRARY_PATH

    # Step 1: Compiler instrumented binaries
    cd ../../
    mkdir build && cd build
    cmake -G Ninja -DENABLE_TT=OFF -DENABLE_DAISY_RTL=ON -DTT_IMPL=TT_IMPL_ELLPACK -DCMAKE_BUILD_TYPE=RelWithDebInfo ..
    ninja

    # Rename libOpenFOAM.so to libOpenFOAM.instrumented.so to avoid conflicts
    mv libOpenFOAM.so libOpenFOAM.instrumented.so

    # Step 2: Compiler non-instrumented binaries
    cmake -G Ninja -DENABLE_TT=OFF -DENABLE_DAISY_RTL=OFF -DTT_IMPL=TT_IMPL_ELLPACK -DCMAKE_BUILD_TYPE=RelWithDebInfo ..
    ninja

    # Create python virtual environment and install numpy
    python3 -m venv /workspace/venv
    . /workspace/venv/bin/activate
    pip install --upgrade pip
    pip install numpy>=1.20.0

    # CLI runners will automatically measure application performance with non-instrumented binaries
    # and then run with instrumented binaries for coverage data collection

  run:
    cavity-TT:
      command: $WM_PROJECT_DIR/bin/foamRun -case $WM_PROJECT_DIR/tutorials/incompressibleFluid/cavity-TT
      env:
        TT_FOAM_KERNEL_DIR: /workspace/daisy-tt-rt/src/tenstorrent-kernels
        FOAM_APP: "$WM_PROJECT_DIR/applications"
        FOAM_APPBIN: "$WM_PROJECT_DIR/platforms/linux64GccSPInt32Opt/bin"
        FOAM_EXT_LIBBIN: "$WM_PROJECT_DIR/ThirdParty-dev/platforms/linux64GccSPInt32/lib"
        FOAM_INST_DIR: "/"
        FOAM_LIBBIN: "$WM_PROJECT_DIR/platforms/linux64GccSPInt32Opt/lib"
        FOAM_MODULES: "$WM_PROJECT_DIR/applications/modules"
        FOAM_MPI: "openmpi-system"
        FOAM_PROJECT_DIR: "/workspace"
        FOAM_SOLVERS: "$WM_PROJECT_DIR/applications/solvers"
        FOAM_SRC: "$WM_PROJECT_DIR/src"
        FOAM_TUTORIALS: "$WM_PROJECT_DIR/tutorials"
        FOAM_USER_APPBIN: "/platforms/linux64GccSPInt32Opt/bin"
        FOAM_USER_LIBBIN: "/platforms/linux64GccSPInt32Opt/lib"
        FOAM_UTILITIES: "$WM_PROJECT_DIR/applications/utilities"
        WM_ARCH: "linux64"
        WM_ARCH_OPTION: "64"
        WM_CC: "gcc"
        WM_CFLAGS: "-m64 -fPIC -g"
        WM_COMPILER: "Gcc"
        WM_COMPILER_LIB_ARCH: "64"
        WM_COMPILE_OPTION: "Opt"
        WM_CXX: "g++"
        WM_CXXFLAGS: "-m64 -fPIC -std: c++0x -g"
        WM_DIR: "$WM_PROJECT_DIR/wmake"
        WM_LABEL_OPTION: "Int32"
        WM_LABEL_SIZE: "32"
        WM_LDFLAGS: "-m64"
        WM_LINK_LANGUAGE: "c++"
        WM_MPLIB: NONE #"SYSTEMOPENMPI"
        WM_OPTIONS: "linux64GccSPInt32Opt"
        WM_OSTYPE: "POSIX"
        WM_PRECISION_OPTION: "SP"
        WM_PROJECT: "OpenFOAM"
        WM_PROJECT_DIR: "/workspace/3rdParty/OpenFOAM-dev"
        WM_PROJECT_INST_DIR: "/"
        WM_THIRD_PARTY_DIR: "$WM_PROJECT_DIR/ThirdParty-dev"
        SCOTCH_TYPE: none #ThirdParty
        METIS_TYPE: none
        PARMETIS_TYPE: none
        ZOLTAN_TYPE: none #ThirdParty
        PATH: $PATH:$WM_PROJECT_DIR/wmake
        LD_LIBRARY_PATH: /workspace/build:$WM_PROJECT_DIR/platforms/linux64GccSPInt32Opt/lib:$WM_PROJECT_DIR/platforms/linux64GccSPInt32Opt/lib/dummy:$LD_LIBRARY_PATH
        LIBRARY_PATH: $LIBRARY_PATH:/usr/local/lib

    cavity:
      command: $WM_PROJECT_DIR/bin/foamRun -case $WM_PROJECT_DIR/tutorials/incompressibleFluid/cavity
      env:
        TT_FOAM_KERNEL_DIR: /workspace/daisy-tt-rt/src/tenstorrent-kernels
        FOAM_APP: "$WM_PROJECT_DIR/applications"
        FOAM_APPBIN: "$WM_PROJECT_DIR/platforms/linux64GccSPInt32Opt/bin"
        FOAM_EXT_LIBBIN: "$WM_PROJECT_DIR/ThirdParty-dev/platforms/linux64GccSPInt32/lib"
        FOAM_INST_DIR: "/"
        FOAM_LIBBIN: "$WM_PROJECT_DIR/platforms/linux64GccSPInt32Opt/lib"
        FOAM_MODULES: "$WM_PROJECT_DIR/applications/modules"
        FOAM_MPI: "openmpi-system"
        FOAM_PROJECT_DIR: "/workspace"
        FOAM_SOLVERS: "$WM_PROJECT_DIR/applications/solvers"
        FOAM_SRC: "$WM_PROJECT_DIR/src"
        FOAM_TUTORIALS: "$WM_PROJECT_DIR/tutorials"
        FOAM_USER_APPBIN: "/platforms/linux64GccSPInt32Opt/bin"
        FOAM_USER_LIBBIN: "/platforms/linux64GccSPInt32Opt/lib"
        FOAM_UTILITIES: "$WM_PROJECT_DIR/applications/utilities"
        WM_ARCH: "linux64"
        WM_ARCH_OPTION: "64"
        WM_CC: "gcc"
        WM_CFLAGS: "-m64 -fPIC -g"
        WM_COMPILER: "Gcc"
        WM_COMPILER_LIB_ARCH: "64"
        WM_COMPILE_OPTION: "Opt"
        WM_CXX: "g++"
        WM_CXXFLAGS: "-m64 -fPIC -std: c++0x -g"
        WM_DIR: "$WM_PROJECT_DIR/wmake"
        WM_LABEL_OPTION: "Int32"
        WM_LABEL_SIZE: "32"
        WM_LDFLAGS: "-m64"
        WM_LINK_LANGUAGE: "c++"
        WM_MPLIB: NONE #"SYSTEMOPENMPI"
        WM_OPTIONS: "linux64GccSPInt32Opt"
        WM_OSTYPE: "POSIX"
        WM_PRECISION_OPTION: "SP"
        WM_PROJECT: "OpenFOAM"
        WM_PROJECT_DIR: "/workspace/3rdParty/OpenFOAM-dev"
        WM_PROJECT_INST_DIR: "/"
        WM_THIRD_PARTY_DIR: "$WM_PROJECT_DIR/ThirdParty-dev"
        SCOTCH_TYPE: none #ThirdParty
        METIS_TYPE: none
        PARMETIS_TYPE: none
        ZOLTAN_TYPE: none #ThirdParty
        PATH: $PATH:$WM_PROJECT_DIR/wmake
        LD_LIBRARY_PATH: $WM_PROJECT_DIR/platforms/linux64GccSPInt32Opt/lib:$WM_PROJECT_DIR/platforms/linux64GccSPInt32Opt/lib/dummy:$LD_LIBRARY_PATH
        LIBRARY_PATH: $LIBRARY_PATH:/usr/local/lib

    comparison-cavity:
      command: /workspace/venv/bin/python /workspace/tests/reference_tests/compare_results.py --case_folder $WM_PROJECT_DIR/tutorials/incompressibleFluid/cavity-TT --reference_folder $WM_PROJECT_DIR/tutorials/incompressibleFluid/cavity --tolerance 1e-6
      WM_PROJECT_DIR: "/workspace/3rdParty/OpenFOAM-dev"
