on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

parameters:
  container: daisytuner/x64-tenstorrent:0.63.0-latest
  timeout: 120
  partitions:
    - chamomile-ci

steps:
  build: |
    apt-get update
    apt-get install -y build-essential libopenmpi-dev zlib1g-dev gnuplot gnuplot-x11 libxt-dev cmake flex
    apt-get install -y libxml2-dev libhdf5-dev libavfilter-dev libtheora-dev libgl2ps-dev libx11-dev libqt5x11extras5-dev libglew-dev libutfcpp-dev 

    # Set up OpenFOAM environment
    cd 3rdParty/OpenFOAM-dev/
    export WM_PROJECT_DIR=$(pwd)
    . ./etc/custom_bashrc

    # Generate include files
    ./wmake/wmakeLnIncludeAll

    # Install OpenFOAM
    ./Allwmake -j128

    # Build driven cavity example
    cd ${WM_PROJECT_DIR}/tutorials/incompressibleFluid/cavity
    ${FOAM_APPBIN}/blockMesh
    cd ${WM_PROJECT_DIR}

    # Build motorcycle example
    #cd ${WM_PROJECT_DIR}/tutorials/incompressibleFluid/motorBikeSteady
    #cp $FOAM_TUTORIALS/resources/geometry/motorBike.obj.gz constant/geometry/
    #${FOAM_APPBIN}/surfaceFeatures
    #${FOAM_APPBIN}/blockMesh
    #${FOAM_APPBIN}/snappyHexMesh -overwrite
    #${FOAM_APPBIN}/patchSummary
    #${FOAM_APPBIN}/potentialFoam


    # Build tests with CMake and Ninja

    # Set up DAISY environment for rtl
    export CPATH=$DOCC_ROOT/include:$CPATH
    export LIBRARY_PATH=$DOCC_ROOT/lib:$LIBRARY_PATH

    # Step 1: Compiler instrumented binaries
    cd ../../
    mkdir build && cd build
    cmake -G Ninja -DENABLE_TT=ON -DENABLE_DAISY_RTL=ON -DTT_IMPL=TT_IMPL_ELLPACK -DCMAKE_BUILD_TYPE=RelWithDebInfo ..
    ninja

    # Rename libOpenFOAM.so to libOpenFOAM.instrumented.so to avoid conflicts
    mv libOpenFOAM.so libOpenFOAM.instrumented.so
    cp tt-bench-harness/tt_bench_ellpack_Amul.out tt-bench-harness/tt_bench_ellpack_Amul.instrumented.out

    # Step 2: Compiler non-instrumented binaries
    cmake -G Ninja -DENABLE_TT=ON -DENABLE_DAISY_RTL=OFF -DTT_IMPL=TT_IMPL_ELLPACK -DCMAKE_BUILD_TYPE=RelWithDebInfo ..
    ninja

    # CLI runners will automatically measure application performance with non-instrumented binaries
    # and then run with instrumented binaries for coverage data collection

  run:
    cavity:
      command: bin/foamRun -case ./tutorials/incompressibleFluid/cavity
      env:
        TT_FOAM_KERNEL_DIR: $WM_PROJECT_DIR/daisy-tt-rt/src/tenstorrent-kernels
        FOAM_APP: "$WM_PROJECT_DIR/applications"
        FOAM_APPBIN: "$WM_PROJECT_DIR/platforms/linux64GccSPInt32Opt/bin"
        FOAM_EXT_LIBBIN: "$WM_PROJECT_DIR/ThirdParty-dev/platforms/linux64GccSPInt32/lib"
        FOAM_INST_DIR: "/"
        FOAM_LIBBIN: "$WM_PROJECT_DIR/platforms/linux64GccSPInt32Opt/lib"
        FOAM_MODULES: "$WM_PROJECT_DIR/applications/modules"
        FOAM_MPI: "openmpi-system"
        FOAM_PROJECT_DIR: "/workspace"
        FOAM_SOLVERS: "$WM_PROJECT_DIR/applications/solvers"
        FOAM_SRC: "$WM_PROJECT_DIR/src"
        FOAM_TUTORIALS: "$WM_PROJECT_DIR/tutorials"
        FOAM_USER_APPBIN: "/platforms/linux64GccSPInt32Opt/bin"
        FOAM_USER_LIBBIN: "/platforms/linux64GccSPInt32Opt/lib"
        FOAM_UTILITIES: "$WM_PROJECT_DIR/applications/utilities"
        WM_ARCH: "linux64"
        WM_ARCH_OPTION: "64"
        WM_CC: "gcc"
        WM_CFLAGS: "-m64 -fPIC -g"
        WM_COMPILER: "Gcc"
        WM_COMPILER_LIB_ARCH: "64"
        WM_COMPILE_OPTION: "Opt"
        WM_CXX: "g++"
        WM_CXXFLAGS: "-m64 -fPIC -std: c++0x -g"
        WM_DIR: "$WM_PROJECT_DIR/wmake"
        WM_LABEL_OPTION: "Int32"
        WM_LABEL_SIZE: "32"
        WM_LDFLAGS: "-m64"
        WM_LINK_LANGUAGE: "c++"
        WM_MPLIB: NONE #"SYSTEMOPENMPI"
        WM_OPTIONS: "linux64GccSPInt32Opt"
        WM_OSTYPE: "POSIX"
        WM_PRECISION_OPTION: "SP"
        WM_PROJECT: "OpenFOAM"
        WM_PROJECT_DIR: "/workspace"
        WM_PROJECT_INST_DIR: "/"
        WM_THIRD_PARTY_DIR: "$WM_PROJECT_DIR/ThirdParty-dev"
        SCOTCH_TYPE: none #ThirdParty
        METIS_TYPE: none
        PARMETIS_TYPE: none
        ZOLTAN_TYPE: none #ThirdParty
        PATH: $PATH:$WM_PROJECT_DIR/wmake
        LD_LIBRARY_PATH: $WM_PROJECT_DIR/build:/usr/lib/x86_64-linux-gnu:/usr/local/lib:/usr/local/lib64:/usr/local/papi/lib:/usr/local/cuda-12.8/lib64:$WM_PROJECT_DIR/platforms/linux64GccSPInt32Opt/lib:$WM_PROJECT_DIR/platforms/linux64GccSPInt32Opt/lib/dummy
        LIBRARY_PATH: /usr/local/lib

