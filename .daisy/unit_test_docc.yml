on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

parameters:
  timeout: 120
  partitions:
    - chamomile

steps:
  build: |
    apt-get update
    apt-get install -y build-essential libopenmpi-dev zlib1g-dev gnuplot gnuplot-x11 libxt-dev cmake flex
    apt-get install -y libxml2-dev libhdf5-dev libavfilter-dev libtheora-dev libgl2ps-dev libx11-dev libqt5x11extras5-dev libglew-dev libutfcpp-dev 

    # Set up OpenFOAM environment
    cd 3rdParty/OpenFOAM-dev/
    export WM_PROJECT_DIR=$(pwd)
    . ./etc/custom_bashrc

    # Generate include files
    ./wmake/wmakeLnIncludeAll

    # Build tests with CMake and Ninja
    export DOCC_CI=

    cd ../../
    mkdir build && cd build
    # cmake -G Ninja -DENABLE_TT=OFF -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=docc -DCMAKE_CXX_COMPILER=docc-cpp ..
    cmake -G Ninja -DENABLE_TT=OFF -DCMAKE_C_COMPILER=docc -DCMAKE_CXX_COMPILER=docc-cpp ..
    ninja

  run:
    lduMatrixATmul_SumA:
      command: ./build/tests/lduMatrixATmul_SumA
      env:
        LD_LIBRARY_PATH: /workspace/build:$LD_LIBRARY_PATH
        FOAM_APP: /workspace/3rdParty/OpenFOAM-dev/applications
        FOAM_APPBIN: /workspace/3rdParty/OpenFOAM-dev/platforms/linux64GccSPInt32Opt/bin
        FOAM_EXT_LIBBIN: /workspace/3rdParty/OpenFOAM-dev/ThirdParty-dev/platforms/linux64GccSPInt32/lib
        FOAM_INST_DIR: "/"
        FOAM_LIBBIN: /workspace/3rdParty/OpenFOAM-dev/platforms/linux64GccSPInt32Opt/lib
        FOAM_MODULES: /workspace/3rdParty/OpenFOAM-dev/applications/modules
        FOAM_MPI: "openmpi-system"
        FOAM_PROJECT_DIR: /workspace/3rdParty/OpenFOAM-dev
        FOAM_SOLVERS: /workspace/3rdParty/OpenFOAM-dev/applications/solvers
        FOAM_SRC: /workspace/3rdParty/OpenFOAM-dev/src
        FOAM_TUTORIALS: /workspace/3rdParty/OpenFOAM-dev/tutorials
        FOAM_USER_APPBIN: "/platforms/linux64GccSPInt32Opt/bin"
        FOAM_USER_LIBBIN: "/platforms/linux64GccSPInt32Opt/lib"
        FOAM_UTILITIES: /workspace/3rdParty/OpenFOAM-dev/applications/utilities
        WM_ARCH: "linux64"
        WM_ARCH_OPTION: "64"
        WM_CC: "gcc"
        WM_CFLAGS: "-m64 -fPIC -g"
        WM_COMPILER: "Gcc"
        WM_COMPILER_LIB_ARCH: "64"
        WM_COMPILE_OPTION: "Opt"
        WM_CXX: "g++"
        WM_CXXFLAGS: "-m64 -fPIC -std: c++0x -g"
        WM_DIR: /workspace/3rdParty/OpenFOAM-dev/wmake
        WM_LABEL_OPTION: "Int32"
        WM_LABEL_SIZE: "32"
        WM_LDFLAGS: "-m64"
        WM_LINK_LANGUAGE: "c++"
        WM_MPLIB: NONE
        WM_OPTIONS: "linux64GccSPInt32Opt"
        WM_OSTYPE: "POSIX"
        WM_PRECISION_OPTION: "SP"
        WM_PROJECT: "OpenFOAM"
        WM_PROJECT_INST_DIR: "/"
        WM_THIRD_PARTY_DIR: /workspace/3rdParty/OpenFOAM-dev/ThirdParty-dev
        SCOTCH_TYPE: none
        METIS_TYPE: none
        PARMETIS_TYPE: none
        ZOLTAN_TYPE: none
    lduMatrixOperations_AddAssign_symm:
      command: ./build/tests/lduMatrixOperations_AddAssign_symm
      env:
        LD_LIBRARY_PATH: /workspace/build:$LD_LIBRARY_PATH
        FOAM_APP: /workspace/3rdParty/OpenFOAM-dev/applications
        FOAM_APPBIN: /workspace/3rdParty/OpenFOAM-dev/platforms/linux64GccSPInt32Opt/bin
        FOAM_EXT_LIBBIN: /workspace/3rdParty/OpenFOAM-dev/ThirdParty-dev/platforms/linux64GccSPInt32/lib
