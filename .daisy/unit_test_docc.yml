on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

parameters:
  timeout: 120
  partitions:
    - zinnia-ci
    - zinnia

steps:
  build: |
    apt-get update
    apt-get install -y build-essential libopenmpi-dev zlib1g-dev gnuplot gnuplot-x11 libxt-dev cmake flex
    apt-get install -y libxml2-dev libhdf5-dev libavfilter-dev libtheora-dev libgl2ps-dev libx11-dev libqt5x11extras5-dev libglew-dev libutfcpp-dev 

    # Set up OpenFOAM environment
    cd 3rdParty/OpenFOAM-dev/
    export WM_PROJECT_DIR=$(pwd)
    . ./etc/custom_bashrc

    # Generate include files
    ./wmake/wmakeLnIncludeAll
    cd ../../

    # Build DOCC plugin
    cd plugin
    mkdir build && cd build
    cmake -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo ..
    ninja
    cd ../..

    export DOCC_CI=regions

    # Build tests with CMake and Ninja
    mkdir build && cd build
    cmake -G Ninja -DENABLE_TT=OFF -DENABLE_DAISY_RTL=OFF -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=docc -DCMAKE_CXX_COMPILER=docc-cpp ..
    ninja

  run:
    lduMatrixATmul_Amul:
      command: ./build/tests/lduMatrixATmul_Amul_test
      env:
        WM_PROJECT_DIR: /workspace/3rdParty/OpenFOAM-dev
        LD_LIBRARY_PATH: /workspace/build:$LD_LIBRARY_PATH
    lduMatrixATmul_SumA:
      command: ./build/tests/lduMatrixATmul_SumA
      env:
        WM_PROJECT_DIR: /workspace/3rdParty/OpenFOAM-dev
        LD_LIBRARY_PATH: /workspace/build:$LD_LIBRARY_PATH
    lduMatrixOperations_AddAssign_symm_expand:
      command: ./build/tests/lduMatrixOperations_AddAssign_symm_expand
      env:
        WM_PROJECT_DIR: /workspace/3rdParty/OpenFOAM-dev
        LD_LIBRARY_PATH: /workspace/build:$LD_LIBRARY_PATH
    lduMatrixOperations_AddAssign_symm_initdiag:
      command: ./build/tests/lduMatrixOperations_AddAssign_symm_initdiag
      env:
        WM_PROJECT_DIR: /workspace/3rdParty/OpenFOAM-dev
        LD_LIBRARY_PATH: /workspace/build:$LD_LIBRARY_PATH
    lduMatrixOperations_AddAssign_symm_noinput:
      command: ./build/tests/lduMatrixOperations_AddAssign_symm_noinput
      env:
        WM_PROJECT_DIR: /workspace/3rdParty/OpenFOAM-dev
        LD_LIBRARY_PATH: /workspace/build:$LD_LIBRARY_PATH
    lduMatrixOperations_AddAssign_symm:
      command: ./build/tests/lduMatrixOperations_AddAssign_symm
      env:
        WM_PROJECT_DIR: /workspace/3rdParty/OpenFOAM-dev
        LD_LIBRARY_PATH: /workspace/build:$LD_LIBRARY_PATH
    lduMatrixOperations_AddAssign_asymm:
      command: ./build/tests/lduMatrixOperations_AddAssign_asymm
      env:
        WM_PROJECT_DIR: /workspace/3rdParty/OpenFOAM-dev
        LD_LIBRARY_PATH: /workspace/build:$LD_LIBRARY_PATH
