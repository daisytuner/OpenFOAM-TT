on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

parameters:
  container: daisytuner/x64-tenstorrent:0.63.0-latest
  timeout: 120
  partitions:
    - zinnia-ci
    - zinnia

steps:
  build: |
    apt-get update
    apt-get install -y build-essential libopenmpi-dev zlib1g-dev gnuplot gnuplot-x11 libxt-dev cmake flex
    apt-get install -y libxml2-dev libhdf5-dev libavfilter-dev libtheora-dev libgl2ps-dev libx11-dev libqt5x11extras5-dev libglew-dev libutfcpp-dev 
    apt-get install -y libboost-container-dev

    # Set up OpenFOAM environment
    cd 3rdParty/OpenFOAM-dev/
    export WM_PROJECT_DIR=$(pwd)
    . ./etc/custom_bashrc

    # Generate include files
    ./wmake/wmakeLnIncludeAll
    cd ../../

    export DOCC_CI=regions

    # Build tests with CMake and Ninja
    mkdir build && cd build
    cmake -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=RelWithDebInfo -DTT_IMPL=TT_IMPL_ELLPACK -DCMAKE_C_COMPILER=docc -DCMAKE_CXX_COMPILER=docc-cpp ..
    ninja

  run:
    lduMatrixATmul_Amul:
      command: ./build/tests/lduMatrixATmul_Amul 40 40
      env:
        WM_PROJECT_DIR: /workspace/3rdParty/OpenFOAM-dev
        LD_LIBRARY_PATH: /workspace/build:$LD_LIBRARY_PATH
        TT_FOAM_KERNEL_DIR: /workspace/daisy-tt-rt/src/tenstorrent-kernels
    lduMatrixATmul_SumA:
      command: ./build/tests/lduMatrixATmul_SumA
      env:
        WM_PROJECT_DIR: /workspace/3rdParty/OpenFOAM-dev
        LD_LIBRARY_PATH: /workspace/build:$LD_LIBRARY_PATH
        TT_FOAM_KERNEL_DIR: /workspace/daisy-tt-rt/src/tenstorrent-kernels
    lduMatrixOperations_AddAssign:
      command: ./build/tests/lduMatrixOperations_AddAssign_asymm
      env:
        WM_PROJECT_DIR: /workspace/3rdParty/OpenFOAM-dev
        LD_LIBRARY_PATH: /workspace/build:$LD_LIBRARY_PATH
        TT_FOAM_KERNEL_DIR: /workspace/daisy-tt-rt/src/tenstorrent-kernels
